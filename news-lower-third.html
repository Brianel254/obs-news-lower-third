<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1080p Broadcast Lower Third</title>
  <style>
    :root {
      --accent: #c90013;
      --accent-dark: #87000c;
      --panel-light: #ffffff;
      --panel-dark: #b6b9bc;
      --headline-color: #292a2d;
      --subtitle-color: #616367;
      --ticker-color: #ffffff;
      --logo-bg: #38393d;
      --side-inset: 48px;
      --bottom-offset: 54px;
      --corner-top: 42px;
      --corner-left: 48px;
      --ink: #202124;
      --scale: 1;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: "Bahnschrift", "Segoe UI", sans-serif; }

    /* The stage scales as one 1920 × 1080 composition in any OBS browser size. */
    #stage {
      position: absolute;
      width: 1920px;
      height: 1080px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(var(--scale));
      transform-origin: center center;
      pointer-events: none;
      opacity: 1;
      transition: opacity .3s ease;
    }
    #stage.is-off-air { opacity: 0; }

    .live-corner {
      position: absolute;
      left: var(--corner-left);
      top: var(--corner-top);
      min-width: 216px;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.45));
      animation: corner-in .65s cubic-bezier(.2,.75,.2,1) both;
    }
    .live-label {
      display: flex;
      align-items: center;
      gap: 11px;
      width: fit-content;
      height: 43px;
      padding: 0 17px 0 14px;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent));
      color: white;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .08em;
      line-height: 1;
      box-shadow: inset 0 1px rgba(255,255,255,.28);
    }
    .live-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 0 4px rgba(255,255,255,.18);
      animation: pulse 2s ease-in-out infinite;
    }
    .clock-row { display: flex; height: 48px; width: fit-content; }
    .clock {
      display: flex;
      align-items: center;
      min-width: 170px;
      padding: 0 12px;
      background: rgba(250,250,250,.97);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1;
    }
    .clock-zone {
      display: flex;
      align-items: center;
      padding: 0 10px;
      background: #202124;
      color: white;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .05em;
    }

    .lower-third {
      position: absolute;
      left: var(--side-inset);
      right: var(--side-inset);
      bottom: var(--bottom-offset);
      height: 200px;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.48));
      animation: panel-in .9s cubic-bezier(.17,.76,.22,1) both;
    }
    .speaker-id {
      position: absolute;
      bottom: calc(var(--bottom-offset) + 225px);
      width: max-content;
      max-width: 850px;
      min-width: 360px;
      opacity: 0;
      visibility: hidden;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.55));
      --speaker-travel: -130px;
    }
    .speaker-id[data-side="left"] { left: var(--side-inset); text-align: left; }
    .speaker-id[data-side="right"] { right: var(--side-inset); text-align: right; --speaker-travel: 130px; }
    .speaker-id.is-entering, .speaker-id.is-holding, .speaker-id.is-exiting { visibility: visible; }
    .speaker-id.is-entering { animation: speaker-in .8s cubic-bezier(.16,.8,.2,1) both; }
    .speaker-id.is-holding { opacity: 1; }
    .speaker-id.is-exiting { animation: speaker-out .65s cubic-bezier(.55,.05,.68,.19) both; }
    .speaker-name, .speaker-title { display: block; width: fit-content; max-width: 850px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; line-height: 1; }
    .speaker-id[data-side="right"] .speaker-name, .speaker-id[data-side="right"] .speaker-title { margin-left: auto; }
    .speaker-name { font-size: 43px; font-weight: 900; letter-spacing: -.025em; }
    .speaker-title { font-size: 20px; font-weight: 900; letter-spacing: .045em; }
    .speaker-id:not(.has-title) .speaker-title { display: none; }
    .speaker-id[data-template="1"] .speaker-title { background: #fff; color: var(--accent-dark); padding: 4px 10px 3px; font-size: 18px; }
    .speaker-id[data-template="1"] .speaker-name { background: var(--accent); color: #fff; padding: 5px 14px 6px; min-width: 400px; }
    .speaker-id[data-template="2"] .speaker-title { background: var(--accent); color: #fff; padding: 4px 10px 3px; margin-left: auto; margin-right: 13px; font-size: 17px; }
    .speaker-id[data-template="2"] .speaker-name { background: #fff; color: var(--accent-dark); padding: 6px 13px 7px; border-left: 5px solid var(--accent); }
    .speaker-id[data-template="2"][data-side="right"] .speaker-title { margin-right: 0; }
    .speaker-id[data-template="3"] .speaker-name { background: #fff; color: #17191e; padding: 6px 15px 7px; border-top: 4px solid var(--accent); }
    .speaker-id[data-template="3"] .speaker-title { background: rgba(16,18,23,.94); color: #fff; padding: 6px 12px 5px; font-size: 17px; border-left: 4px solid var(--accent); }
    .speaker-id[data-template="4"] .speaker-name { color: #fff; padding: 3px 5px 4px; text-shadow: 0 2px 5px #000, 0 0 15px #000; }
    .speaker-id[data-template="4"] .speaker-title { background: var(--accent); color: #fff; padding: 5px 12px 4px; font-size: 18px; }
    .speaker-id.is-entering .speaker-title { animation: speaker-strip-in .55s .17s cubic-bezier(.16,.8,.2,1) both; }
    .speaker-id.is-entering .speaker-name { animation: speaker-strip-in .58s .28s cubic-bezier(.16,.8,.2,1) both; }
    .speaker-id.is-exiting .speaker-title { animation: speaker-strip-out .5s .02s ease-in both; }
    .speaker-id.is-exiting .speaker-name { animation: speaker-strip-out .5s .1s ease-in both; }
    @keyframes speaker-in { from { opacity: 0; transform: translateX(var(--speaker-travel)) scale(.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes speaker-out { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(var(--speaker-travel)); } }
    @keyframes speaker-strip-in { from { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateY(15px); } to { opacity: 1; clip-path: inset(0 0 0 0); transform: translateY(0); } }
    @keyframes speaker-strip-out { from { opacity: 1; clip-path: inset(0 0 0 0); } to { opacity: 0; clip-path: inset(0 100% 0 0); } }
    .top-rule {
      position: absolute;
      left: 0;
      right: 0;
      top: 17px;
      height: 3px;
      background: rgba(255,255,255,.82);
    }
    .main-panel {
      position: absolute;
      inset: 20px 0 39px;
      display: flex;
      overflow: hidden;
      background: linear-gradient(105deg, var(--panel-light), var(--panel-dark));
      border-left: 13px solid var(--accent);
      box-shadow: inset 0 1px rgba(255,255,255,.95), inset 0 -1px rgba(0,0,0,.14);
    }
    .copy {
      position: relative;
      min-width: 0;
      flex: 1;
      padding: 31px 36px 12px 34px;
      overflow: hidden;
    }
    .headline-frame { position: relative; height: 59px; overflow: hidden; }
    .headline {
      position: absolute;
      inset: 0;
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--headline-color);
      font-size: 57px;
      font-weight: 800;
      line-height: .98;
      letter-spacing: -.025em;
      text-transform: uppercase;
      animation: copy-in .55s .45s both;
    }
    .headline-ghost, .subtitle-ghost { z-index: 2; pointer-events: none; }
    .copy::after {
      content: "";
      position: absolute;
      z-index: 4;
      top: 23px;
      bottom: 17px;
      left: 30px;
      right: 27px;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent) 85%, #ffffff);
      transform: translateX(-105%);
      pointer-events: none;
    }
    .copy.is-transitioning::after { animation: headline-wipe 1.65s cubic-bezier(.4,0,.2,1) both; }
    .subtitle-frame { position: relative; height: 29px; margin-top: 8px; overflow: hidden; }
    .subtitle {
      position: absolute;
      inset: 0;
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--subtitle-color);
      font-size: 25px;
      font-weight: 500;
      line-height: 1.1;
      animation: copy-in .55s .6s both;
    }
    .logo-box {
      position: relative;
      flex: 0 0 244px;
      display: grid;
      place-items: center;
      border-left: 1px solid rgba(0,0,0,.22);
      background: linear-gradient(145deg, var(--logo-bg), #18191d);
      box-shadow: inset 6px 0 12px rgba(0,0,0,.16);
      overflow: hidden;
    }
    .logo-box::before {
      content: "";
      position: absolute;
      width: 225px;
      height: 225px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 50%;
    }
    .logo-placeholder {
      position: relative;
      color: #f2f2f2;
      font-size: 27px;
      font-weight: 800;
      line-height: .9;
      letter-spacing: .06em;
      text-align: center;
    }
    .logo-placeholder span { color: var(--accent); }
    .logo-image { display: none; position: relative; max-width: 88%; max-height: 82%; object-fit: contain; }
    .logo-box.has-logo .logo-image { display: block; }
    .logo-box.has-logo .logo-placeholder { display: none; }

    .breaking-label {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 2;
      height: 42px;
      min-width: 251px;
      display: flex;
      align-items: center;
      padding: 0 27px 0 19px;
      clip-path: polygon(0 0, calc(100% - 23px) 0, 100% 100%, 0 100%);
      background: linear-gradient(90deg, var(--accent-dark), var(--accent));
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.025em;
      text-transform: uppercase;
      text-shadow: 0 1px rgba(0,0,0,.2);
      animation: label-in .65s .25s both;
    }
    .ticker {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 39px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent) 48%, var(--accent-dark));
      color: var(--ticker-color);
      box-shadow: inset 0 1px rgba(255,255,255,.26);
    }
    .ticker-lead {
      z-index: 1;
      flex: 0 0 auto;
      align-self: stretch;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: var(--accent-dark);
      border-right: 2px solid rgba(255,255,255,.6);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .06em;
    }
    .ticker-viewport { flex: 1; min-width: 0; overflow: hidden; }
    .ticker-track {
      display: flex;
      align-items: center;
      width: max-content;
      animation: crawl var(--crawl-duration, 34s) linear infinite;
      will-change: transform;
    }
    .ticker-group { display: flex; flex: 0 0 auto; align-items: center; white-space: nowrap; }
    .ticker-item { padding: 0 21px; font-size: 19px; font-weight: 700; letter-spacing: .005em; }
    .ticker-separator { color: rgba(255,255,255,.7); font-size: 17px; }
    .is-hidden { display: none !important; }
    .lower-third.no-ticker .main-panel { bottom: 0; }

    /* Church: a full-width royal blue service bar, gold details and a top-right brand. */
    .church-brand { display:none; position:absolute; top:45px; right:57px; width:340px; height:104px; align-items:center; justify-content:flex-end; color:#201066; }
    .church-brand-placeholder { display:flex; align-items:center; gap:12px; font-size:21px; font-weight:900; line-height:.98; letter-spacing:.05em; }
    .church-brand-placeholder svg { width:80px; height:80px; fill:#281178; flex:none; }
    .church-brand img { display:none; max-width:100%; max-height:100%; object-fit:contain; object-position:right center; }
    .church-brand.has-logo img { display:block; }
    .church-brand.has-logo .church-brand-placeholder { display:none; }
    #stage[data-theme="church"] .church-brand { display:flex; }
    #stage[data-theme="church"] .lower-third { left:0; right:0; bottom:var(--bottom-offset); height:126px; filter:drop-shadow(0 -3px 13px rgba(18,4,70,.2)); }
    #stage[data-theme="church"] .top-rule { display:none; }
    #stage[data-theme="church"] .main-panel { inset:0; border:0; background:linear-gradient(112deg,var(--panel-light),var(--panel-dark) 80%); box-shadow:none; overflow:visible; }
    #stage[data-theme="church"] .copy { display:grid; grid-template-columns:39% 61%; flex:1; padding:0; overflow:visible; }
    #stage[data-theme="church"] .headline-frame { height:126px; padding:0 26px 17px 64px; border-right:5px solid var(--accent); background:linear-gradient(115deg,var(--panel-light),var(--panel-dark)); overflow:hidden; }
    #stage[data-theme="church"] .headline { inset:auto 22px 17px 64px; color:#fff; font-size:60px; font-weight:900; letter-spacing:-.035em; line-height:1; }
    #stage[data-theme="church"] .subtitle-frame { height:84px; margin:0; padding:17px 24px; background:linear-gradient(100deg,var(--panel-dark),var(--logo-bg)); }
    #stage[data-theme="church"] .subtitle { inset:18px 25px auto; color:#fff; font-size:27px; font-weight:750; letter-spacing:.03em; line-height:1.18; }
    #stage[data-theme="church"] .copy::after { top:0; bottom:0; left:0; right:0; background:linear-gradient(90deg,transparent,var(--accent),#fff,transparent); opacity:.65; }
    #stage[data-theme="church"] .breaking-label { top:-29px; left:136px; min-width:226px; height:30px; padding:0 14px; clip-path:none; background:#fff; color:#1f0e6b; font-size:18px; letter-spacing:.055em; text-shadow:none; border-bottom:3px solid var(--accent); }
    #stage[data-theme="church"] .logo-box { display:none; }
    #stage[data-theme="church"] .ticker { left:39%; height:42px; border-top:1px solid color-mix(in srgb,var(--accent) 55%,transparent); background:linear-gradient(90deg,var(--logo-bg),var(--panel-dark)); box-shadow:none; }
    #stage[data-theme="church"] .ticker-lead { background:linear-gradient(120deg,var(--accent),var(--accent-dark)); color:#1a0b59; border:0; font-size:14px; letter-spacing:.12em; }
    #stage[data-theme="church"] .ticker-item { font-size:17px; font-weight:600; }
    #stage[data-theme="church"] .ticker-separator { color:var(--accent); }
    #stage[data-theme="church"] .live-corner { min-width:150px; filter:none; }
    #stage[data-theme="church"] .live-label { height:31px; padding:0 12px; border-radius:18px; background:#111; color:#fff; font-size:19px; letter-spacing:.12em; box-shadow:none; }
    #stage[data-theme="church"] .live-dot { width:11px; height:11px; background:#ec193a; box-shadow:0 0 0 3px #ec193a33; }
    #stage[data-theme="church"] .clock-row { height:28px; margin:3px 0 0 5px; }
    #stage[data-theme="church"] .clock { min-width:0; padding:0 7px; background:rgba(255,255,255,.9); color:#201066; font-size:18px; }
    #stage[data-theme="church"] .clock-zone { padding:0 7px; background:#201066; color:#fff; font-size:13px; }
    #stage[data-theme="church"] .speaker-id { bottom:calc(var(--bottom-offset) + 130px); min-width:0; max-width:760px; filter:drop-shadow(0 4px 6px rgba(23,8,78,.25)); }
    #stage[data-theme="church"] .speaker-id[data-side="left"] { left:365px; }
    #stage[data-theme="church"] .speaker-id[data-side="right"] { right:125px; }
    #stage[data-theme="church"] .speaker-name { min-width:0; background:linear-gradient(120deg,var(--accent),#fff2a6 45%,var(--accent-dark)) !important; color:#21105f !important; padding:9px 22px 8px !important; font-size:30px; letter-spacing:.02em; text-shadow:none !important; border:0 !important; }
    #stage[data-theme="church"] .speaker-title { background:#fff !important; color:#241069 !important; padding:5px 13px 4px !important; font-size:16px; border:0 !important; font-style:normal; }

    .verse-card { position:absolute; left:50%; bottom:calc(var(--bottom-offset) + 180px); width:1380px; max-width:calc(100% - 130px); min-height:176px; padding:21px 34px 22px 43px; transform:translateX(-50%); visibility:hidden; opacity:0; color:#fff; background:linear-gradient(112deg,#32158e,#190657 55%,#34158f); border-left:9px solid var(--accent); box-shadow:0 18px 38px rgba(12,5,51,.35); }
    .verse-card::before { content:""; position:absolute; top:0; right:0; width:40%; height:5px; background:linear-gradient(90deg,transparent,#fff2a6,var(--accent)); }
    .verse-kicker { color:var(--accent); font-size:17px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    .verse-reference { margin:5px 0 10px; font-size:31px; font-weight:900; letter-spacing:.01em; text-transform:uppercase; }
    .verse-text { margin:0; font-size:33px; font-weight:600; line-height:1.18; max-height:118px; overflow:hidden; }
    .verse-card.is-entering,.verse-card.is-holding,.verse-card.is-exiting { visibility:visible; }
    .verse-card.is-entering { animation:verse-in .85s cubic-bezier(.16,.8,.2,1) both; }
    .verse-card.is-holding { opacity:1; }
    .verse-card.is-exiting { animation:verse-out .7s cubic-bezier(.55,.05,.68,.19) both; }
    .verse-card.is-entering .verse-kicker,.verse-card.is-entering .verse-reference,.verse-card.is-entering .verse-text { animation:verse-copy-in .58s .25s ease-out both; }
    .verse-card.is-text-changing .verse-reference,.verse-card.is-text-changing .verse-text { animation:verse-text-change .42s ease-out both; }
    @keyframes verse-in { from { opacity:0; transform:translate(-50%,90px) scale(.97); clip-path:inset(0 100% 0 0); } to { opacity:1; transform:translate(-50%,0) scale(1); clip-path:inset(0); } }
    @keyframes verse-out { from { opacity:1; transform:translate(-50%,0); clip-path:inset(0); } to { opacity:0; transform:translate(-50%,-40px); clip-path:inset(0 0 100% 0); } }
    @keyframes verse-copy-in { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
    @keyframes verse-text-change { 0% { opacity:0; transform:translateY(16px); filter:blur(4px); } 100% { opacity:1; transform:translateY(0); filter:blur(0); } }
    #stage:not([data-theme="church"]) .verse-card { display:none; }
    .pastor-portrait { display:none; position:absolute; z-index:5; left:44px; bottom:calc(var(--bottom-offset) + 125px); height:300px; max-width:300px; object-fit:contain; object-position:left bottom; filter:drop-shadow(0 10px 9px rgba(14,4,61,.34)); pointer-events:none; }
    #stage[data-theme="church"] .pastor-portrait.has-image { display:block; }

    #stage[data-theme="podcast"] .lower-third { height: 205px; filter: drop-shadow(0 12px 26px rgba(0,0,0,.6)); }
    #stage[data-theme="podcast"] .top-rule { top: 10px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-dark), var(--accent)); }
    #stage[data-theme="podcast"] .main-panel {
      inset: 18px 0 39px; border: 2px solid var(--accent); border-left-width: 8px;
      border-radius: 22px 22px 0 0; background: linear-gradient(110deg, var(--panel-light), var(--panel-dark));
      box-shadow: inset 0 1px rgba(255,255,255,.13), 0 10px 35px rgba(0,0,0,.32);
    }
    #stage[data-theme="podcast"] .lower-third.no-ticker .main-panel { bottom: 0; }
    #stage[data-theme="podcast"] .copy { padding: 36px 34px 10px 35px; }
    #stage[data-theme="podcast"] .headline { font-size: 55px; font-weight: 900; letter-spacing: -.04em; }
    #stage[data-theme="podcast"] .subtitle { font-size: 24px; font-weight: 600; letter-spacing: .015em; }
    #stage[data-theme="podcast"] .breaking-label {
      top: -9px; left: 24px; min-width: 180px; height: 39px; padding: 0 24px;
      clip-path: none; border-radius: 20px; background: var(--accent);
      color: #13252b; font-size: 18px; font-weight: 900; letter-spacing: .1em; text-shadow: none;
    }
    #stage[data-theme="podcast"] .logo-box { flex-basis: 195px; border-left: 1px solid rgba(255,255,255,.16); background: radial-gradient(circle at center, var(--logo-bg), #101322 72%); box-shadow: none; }
    #stage[data-theme="podcast"] .logo-box::before { width: 138px; height: 138px; border: 5px double var(--accent); box-shadow: 0 0 0 13px rgba(255,255,255,.035); }
    #stage[data-theme="podcast"] .logo-box::after { content: ""; position: absolute; left: 30px; right: 30px; bottom: 9px; height: 13px; background: repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 10px); opacity: .7; animation: pulse 1.5s ease-in-out infinite; }
    #stage[data-theme="podcast"] .ticker { height: 39px; border-radius: 0 0 13px 13px; background: linear-gradient(90deg, var(--accent-dark), var(--logo-bg)); box-shadow: inset 0 1px var(--accent); }
    #stage[data-theme="podcast"] .ticker-lead { background: var(--accent); color: #13252b; border-right: 0; border-radius: 0 0 0 12px; }
    #stage[data-theme="podcast"] .ticker-separator { color: var(--accent); }
    #stage[data-theme="podcast"] .live-label { border-radius: 22px 22px 0 0; background: var(--accent); color: #13252b; box-shadow: none; }
    #stage[data-theme="podcast"] .live-dot { background: #13252b; box-shadow: 0 0 0 4px rgba(19,37,43,.15); }
    #stage[data-theme="podcast"] .clock { background: var(--panel-light); color: var(--headline-color); }
    #stage[data-theme="podcast"] .clock-zone { background: var(--logo-bg); border-bottom: 2px solid var(--accent); }
    #stage[data-theme="podcast"] .copy::after { background: linear-gradient(90deg, var(--accent-dark), var(--accent), transparent); }
    .lower-third.theme-switch { animation: theme-enter .85s cubic-bezier(.16,.84,.24,1) both; }
    .live-corner.theme-switch { animation: theme-clock-enter .7s cubic-bezier(.16,.84,.24,1) both; }

    @keyframes panel-in { from { opacity: 0; transform: translateX(-95px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes label-in { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes corner-in { from { opacity: 0; transform: translateY(-28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes copy-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes headline-exit {
      0% { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); }
      100% { opacity: 0; transform: translateX(-300px); clip-path: inset(0 0 0 100%); }
    }
    @keyframes headline-entrance {
      0% { opacity: 0; transform: translateX(300px); clip-path: inset(0 100% 0 0); }
      100% { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); }
    }
    @keyframes headline-wipe {
      0% { transform: translateX(-105%); }
      45% { transform: translateX(0); }
      57% { transform: translateX(0); }
      100% { transform: translateX(105%); }
    }
    @keyframes support-flip-out {
      from { opacity: 1; transform: perspective(600px) rotateX(0); }
      to { opacity: 0; transform: perspective(600px) rotateX(-88deg); }
    }
    @keyframes support-flip-in {
      from { opacity: 0; transform: perspective(600px) rotateX(88deg); }
      to { opacity: 1; transform: perspective(600px) rotateX(0); }
    }
    @keyframes theme-enter { from { opacity: 0; transform: translateY(70px) scale(.97); filter: blur(6px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    @keyframes theme-clock-enter { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes church-headline-out { to { opacity: 0; transform: translateY(-38px); filter: blur(5px); } }
    @keyframes church-headline-in { from { opacity: 0; transform: translateY(42px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes podcast-headline-out { to { opacity: 0; transform: translateX(-145px) scale(.88); } }
    @keyframes podcast-headline-in { from { opacity: 0; transform: translateX(155px) scale(1.08); } to { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes pulse { 50% { opacity: .55; box-shadow: 0 0 0 7px rgba(255,255,255,.08); } }
    @keyframes crawl { to { transform: translateX(-50%); } }
  </style>
</head>
<body>
  <div id="stage">
    <div class="live-corner" aria-label="Live broadcast clock">
      <div class="live-label"><span class="live-dot"></span>LIVE</div>
      <div class="clock-row"><div class="clock" id="clock">00:00:00</div><div class="clock-zone" id="clock-zone">EAT</div></div>
    </div>
    <div class="church-brand" id="church-brand" aria-label="Church logo">
      <div class="church-brand-placeholder"><svg viewBox="0 0 80 80" aria-hidden="true"><path d="M37 4h6v15h-6zM30 10h20v5H30zM40 20 8 47v7l8-5v23h18V55h12v17h18V49l8 5v-7L40 20Zm-13 32h8v10h-8V52Zm25 0h8v10h-8V52Z"/></svg><span>YOUR CHURCH<br>NAME HERE</span></div>
      <img id="church-logo-image" alt="Church logo">
    </div>
    <img class="pastor-portrait" id="pastor-portrait" alt="Pastor portrait">

    <div class="speaker-id" id="speaker-id" data-template="1" data-side="left" aria-label="Speaker identification">
      <div class="speaker-title" id="speaker-title"></div>
      <div class="speaker-name" id="speaker-name"></div>
    </div>
    <div class="verse-card" id="verse-card" aria-label="Bible verse">
      <div class="verse-kicker">SCRIPTURE READING · KJV</div>
      <div class="verse-reference" id="verse-reference"></div>
      <p class="verse-text" id="verse-text"></p>
    </div>

    <div class="lower-third">
      <div class="top-rule"></div>
      <div class="breaking-label" id="label">BREAKING NEWS</div>
      <div class="main-panel">
        <div class="copy">
          <div class="headline-frame" id="headline-frame"><h1 class="headline" id="headline">YOUR HEADLINE HERE</h1></div>
          <div class="subtitle-frame" id="subtitle-frame"><p class="subtitle" id="subtitle">Your supporting line stays on screen</p></div>
        </div>
        <div class="logo-box" id="logo-box">
          <div class="logo-placeholder">YOUR<br><span>LOGO</span></div>
          <img class="logo-image" id="logo-image" alt="Channel logo">
        </div>
      </div>
      <div class="ticker">
        <div class="ticker-lead">LATEST</div>
        <div class="ticker-viewport"><div class="ticker-track" id="ticker-track"></div></div>
      </div>
    </div>
  </div>

  <script>
    // These defaults work when opened as a local file. The control page overrides
    // them automatically when both pages are served by news-overlay-server.py.
    const defaults = {
      theme: "news",
      label: "BREAKING NEWS",
      headline: "YOUR HEADLINE HERE",
      subtitle: "Your supporting line stays on screen",
      ticker: "Replace this message with your scrolling update",
      supportingLines: ["Your supporting line stays on screen"],
      supportingInterval: 7,
      tickerItems: ["Replace this message with your scrolling update"],
      timeZone: "Africa/Nairobi",
      zoneLabel: "EAT",
      logo: "logo.png", pastorImage: "",
      tickerSeconds: 34,
      accent: "#c90013",
      accentDark: "#87000c",
      panelLight: "#ffffff",
      panelDark: "#b6b9bc",
      headlineColor: "#292a2d",
      subtitleColor: "#616367",
      tickerColor: "#ffffff",
      logoBg: "#38393d",
      showLive: true,
      showOverlay: true,
      showLabel: true,
      showSubtitle: true,
      showTicker: true,
      showLogo: true,
      showSeconds: true,
      bottomOffset: 54,
      sideInset: 48,
      cornerTop: 42,
      cornerLeft: 48,
      speakerName: "", speakerTitle: "", speakerTemplate: 1, speakerSide: "left",
      speakerStay: 4, speakerEventId: "", speakerStartedAt: 0,
      verseBook: "", verseChapter: 0, verseNumber: 0, verseEnd: 0,
      verseReference: "", verseText: "", verseStay: 10, verseEventId: "", verseStartedAt: 0
    };
    let config = { ...defaults };
    const params = new URLSearchParams(location.search);
    if (params.get("preview") === "1") {
      document.body.style.background = "linear-gradient(135deg, #32373d, #15171b 60%, #414449)";
    }
    for (const key of ["label", "headline", "subtitle", "ticker", "timeZone", "zoneLabel", "logo"]) {
      if (params.has(key)) config[key] = params.get(key);
    }
    if (params.has("tickerSeconds")) config.tickerSeconds = Number(params.get("tickerSeconds")) || 34;
    const byId = id => document.getElementById(id);
    const root = document.documentElement;
    const stage = byId("stage");
    const lowerThird = document.querySelector(".lower-third");
    const liveCorner = document.querySelector(".live-corner");
    const ticker = document.querySelector(".ticker");
    const track = byId("ticker-track");
    const logo = document.getElementById("logo-image");
    const logoBox = byId("logo-box");
    const churchLogo = byId("church-logo-image");
    const churchBrand = byId("church-brand");
    const pastorPortrait = byId("pastor-portrait");
    const headlineElement = byId("headline");
    const headlineFrame = byId("headline-frame");
    const subtitleElement = byId("subtitle");
    const subtitleFrame = byId("subtitle-frame");
    const copyPanel = document.querySelector(".copy");
    let storyFinishTimer = null;
    let outgoingHeadline = null;
    let outgoingSubtitle = null;
    let supportFlipTimer = null;
    let supportFlipGhost = null;
    let supportingRotationTimer = null;
    let supportingIndex = 0;
    let themeSwitchTimer = null;
    const speaker = byId("speaker-id");
    const verseCard = byId("verse-card");
    let verseTimers = [];
    let lastVerseEventId = "";
    function clearVerseTimers() { verseTimers.forEach(clearTimeout); verseTimers = []; }
    function hideVerse(animate = true) {
      clearVerseTimers();
      if (!animate || !verseCard.classList.contains("is-holding") && !verseCard.classList.contains("is-entering")) {
        verseCard.className = "verse-card";
        return;
      }
      verseCard.className = "verse-card is-exiting";
      verseTimers.push(setTimeout(() => { verseCard.className = "verse-card"; }, 720));
    }
    function playVerse(data, startedAt = Date.now(), textOnly = false) {
      clearVerseTimers();
      const age = Math.max(0, Date.now() - startedAt);
      const enterMs = 850;
      const stayMs = Number(data.verseStay || 10) * 1000;
      const exitMs = 700;
      if (!data.verseText || age >= enterMs + stayMs + exitMs) { verseCard.className = "verse-card"; return; }
      const keepCard = textOnly && (verseCard.classList.contains("is-holding") || verseCard.classList.contains("is-entering"));
      byId("verse-reference").textContent = data.verseReference || "";
      const textElement = byId("verse-text");
      textElement.textContent = data.verseText;
      textElement.style.fontSize = data.verseText.length > 320 ? "24px" : data.verseText.length > 220 ? "28px" : "33px";
      if (keepCard) {
        verseCard.className = "verse-card is-holding is-text-changing";
        verseTimers.push(setTimeout(() => verseCard.classList.remove("is-text-changing"), 450));
        verseTimers.push(setTimeout(() => { verseCard.className = "verse-card is-exiting"; }, stayMs));
        verseTimers.push(setTimeout(() => { verseCard.className = "verse-card"; }, stayMs + exitMs));
        return;
      }
      verseCard.className = "verse-card";
      verseCard.style.animationDelay = "";
      void verseCard.offsetWidth;
      if (age < enterMs) {
        verseCard.classList.add("is-entering");
        verseCard.style.animationDelay = `-${age}ms`;
        verseTimers.push(setTimeout(() => { verseCard.className = "verse-card is-holding"; verseCard.style.animationDelay = ""; }, enterMs - age));
      } else if (age < enterMs + stayMs) {
        verseCard.classList.add("is-holding");
      } else {
        verseCard.classList.add("is-exiting");
        verseCard.style.animationDelay = `-${age - enterMs - stayMs}ms`;
      }
      if (age < enterMs + stayMs) verseTimers.push(setTimeout(() => {
        verseCard.className = "verse-card is-exiting";
        verseCard.style.animationDelay = "";
      }, enterMs + stayMs - age));
      verseTimers.push(setTimeout(() => { verseCard.className = "verse-card"; verseCard.style.animationDelay = ""; }, enterMs + stayMs + exitMs - age));
    }
    let speakerTimers = [];
    let lastSpeakerEventId = "";
    function clearSpeakerTimers() {
      speakerTimers.forEach(clearTimeout);
      speakerTimers = [];
    }
    function hideSpeaker(animate = true) {
      clearSpeakerTimers();
      if (!animate || !speaker.classList.contains("is-holding") && !speaker.classList.contains("is-entering")) {
        speaker.className = "speaker-id";
        return;
      }
      speaker.className = "speaker-id is-exiting";
      speakerTimers.push(setTimeout(() => { speaker.className = "speaker-id"; }, 670));
    }
    function playSpeaker(data, startedAt = Date.now()) {
      clearSpeakerTimers();
      const age = Math.max(0, Date.now() - startedAt);
      const enterMs = 800;
      const stayMs = Number(data.speakerStay || 4) * 1000;
      const exitMs = 650;
      if (!data.speakerName || age >= enterMs + stayMs + exitMs) {
        speaker.className = "speaker-id";
        return;
      }
      byId("speaker-name").textContent = data.speakerName;
      byId("speaker-title").textContent = data.speakerTitle || "";
      speaker.className = "speaker-id";
      speaker.style.animationDelay = "";
      speaker.classList.toggle("has-title", Boolean(data.speakerTitle));
      speaker.dataset.template = String(data.speakerTemplate || 1);
      speaker.dataset.side = data.speakerSide === "right" ? "right" : "left";
      void speaker.offsetWidth;
      if (age < enterMs) {
        speaker.classList.add("is-entering");
        speaker.style.animationDelay = `-${age}ms`;
        speakerTimers.push(setTimeout(() => {
          speaker.className = `speaker-id${data.speakerTitle ? " has-title" : ""} is-holding`;
          speaker.style.animationDelay = "";
        }, enterMs - age));
      } else if (age < enterMs + stayMs) {
        speaker.classList.add("is-holding");
      } else {
        speaker.classList.add("is-exiting");
        speaker.style.animationDelay = `-${age - enterMs - stayMs}ms`;
      }
      if (age < enterMs + stayMs) speakerTimers.push(setTimeout(() => {
        speaker.className = `speaker-id${data.speakerTitle ? " has-title" : ""} is-exiting`;
        speaker.style.animationDelay = "";
      }, enterMs + stayMs - age));
      speakerTimers.push(setTimeout(() => { speaker.className = "speaker-id"; speaker.style.animationDelay = ""; }, enterMs + stayMs + exitMs - age));
    }
    function clearSupportingFlip() {
      clearTimeout(supportFlipTimer);
      if (supportFlipGhost) supportFlipGhost.remove();
      supportFlipGhost = null;
      subtitleElement.style.animation = "none";
    }
    function flipSupportingLine(text) {
      clearSupportingFlip();
      supportFlipGhost = subtitleElement.cloneNode(true);
      supportFlipGhost.removeAttribute("id");
      supportFlipGhost.classList.add("subtitle-ghost");
      supportFlipGhost.style.animation = "support-flip-out .52s ease-in both";
      subtitleFrame.appendChild(supportFlipGhost);
      subtitleElement.textContent = text;
      void subtitleElement.offsetWidth;
      subtitleElement.style.animation = "support-flip-in .62s .5s ease-out both";
      supportFlipTimer = setTimeout(clearSupportingFlip, 1200);
    }
    function resetSupportingRotation() {
      clearInterval(supportingRotationTimer);
      supportingIndex = 0;
      if (!copyPanel.classList.contains("is-transitioning")) {
        clearSupportingFlip();
        subtitleElement.textContent = config.supportingLines[0] || "";
      }
      if (config.showSubtitle && config.supportingLines.length > 1) {
        supportingRotationTimer = setInterval(() => {
          supportingIndex = (supportingIndex + 1) % config.supportingLines.length;
          flipSupportingLine(config.supportingLines[supportingIndex]);
        }, config.supportingInterval * 1000);
      }
    }
    function clearStoryTransition() {
      clearTimeout(storyFinishTimer);
      storyFinishTimer = null;
      if (outgoingHeadline) outgoingHeadline.remove();
      if (outgoingSubtitle) outgoingSubtitle.remove();
      outgoingHeadline = null;
      outgoingSubtitle = null;
      copyPanel.classList.remove("is-transitioning");
      headlineElement.style.animation = "none";
      subtitleElement.style.animation = "none";
    }
    function setStory(headline, subtitle, animate) {
      clearSupportingFlip();
      clearStoryTransition();
      if (!animate) {
        headlineElement.textContent = headline;
        subtitleElement.textContent = subtitle;
        return;
      }
      // Keep the outgoing story visible while its replacement enters.
      outgoingHeadline = headlineElement.cloneNode(true);
      outgoingHeadline.removeAttribute("id");
      outgoingHeadline.classList.add("headline-ghost");
      const exitMotion = config.theme === "church" ? "church-headline-out .72s ease-in both"
        : config.theme === "podcast" ? "podcast-headline-out .72s cubic-bezier(.55,.05,.68,.19) both"
        : "headline-exit .75s cubic-bezier(.55,.05,.68,.19) both";
      const enterMotion = config.theme === "church" ? "church-headline-in .78s .78s ease-out both"
        : config.theme === "podcast" ? "podcast-headline-in .72s .8s cubic-bezier(.16,.8,.24,1) both"
        : "headline-entrance .72s .82s cubic-bezier(.16,.8,.24,1) both";
      const subtitleEnterMotion = config.theme === "church" ? "church-headline-in .78s .86s ease-out both"
        : config.theme === "podcast" ? "podcast-headline-in .72s .88s cubic-bezier(.16,.8,.24,1) both"
        : "headline-entrance .72s .9s cubic-bezier(.16,.8,.24,1) both";
      outgoingHeadline.style.animation = exitMotion;
      headlineFrame.appendChild(outgoingHeadline);
      outgoingSubtitle = subtitleElement.cloneNode(true);
      outgoingSubtitle.removeAttribute("id");
      outgoingSubtitle.classList.add("subtitle-ghost");
      outgoingSubtitle.style.animation = exitMotion;
      subtitleFrame.appendChild(outgoingSubtitle);
      headlineElement.textContent = headline;
      subtitleElement.textContent = subtitle;
      void headlineElement.offsetWidth;
      headlineElement.style.animation = enterMotion;
      subtitleElement.style.animation = subtitleEnterMotion;
      copyPanel.classList.add("is-transitioning");
      storyFinishTimer = setTimeout(clearStoryTransition, 1800);
    }
    logo.onload = () => logoBox.classList.add("has-logo");
    logo.onerror = () => logoBox.classList.remove("has-logo");
    churchLogo.onload = () => churchBrand.classList.add("has-logo");
    churchLogo.onerror = () => churchBrand.classList.remove("has-logo");
    pastorPortrait.onload = () => pastorPortrait.classList.add("has-image");
    pastorPortrait.onerror = () => pastorPortrait.classList.remove("has-image");
    let formatter;
    function setClockFormatter() {
      const options = {
        timeZone: config.timeZone,
        hour: "2-digit", minute: "2-digit",
        ...(config.showSeconds ? { second: "2-digit" } : {}),
        hourCycle: "h23"
      };
      try { formatter = new Intl.DateTimeFormat("en-GB", options); }
      catch (_) { delete options.timeZone; formatter = new Intl.DateTimeFormat("en-GB", options); }
    }
    function updateClock() { byId("clock").textContent = formatter.format(new Date()); }
    function buildTicker() {
      track.replaceChildren();
      const group = document.createElement("div");
      group.className = "ticker-group";
      const messages = config.tickerItems.length ? config.tickerItems : [" "];
      function addItem(message) {
        const item = document.createElement("span");
        item.className = "ticker-item";
        item.textContent = message;
        group.appendChild(item);
        const separator = document.createElement("span");
        separator.className = "ticker-separator";
        separator.textContent = "◆";
        group.appendChild(separator);
      }
      track.appendChild(group);
      let copies = 0;
      do {
        for (const message of messages) addItem(message);
      } while (group.offsetWidth < 1700 && copies++ < 40);
      track.appendChild(group.cloneNode(true));
    }
    const cssFields = {
      accent: "--accent", accentDark: "--accent-dark",
      panelLight: "--panel-light", panelDark: "--panel-dark",
      headlineColor: "--headline-color", subtitleColor: "--subtitle-color",
      tickerColor: "--ticker-color", logoBg: "--logo-bg"
    };
    function applyState(next) {
      const old = config;
      config = { ...defaults, ...next };
      config.theme = ["news", "church", "podcast"].includes(config.theme) ? config.theme : "news";
      stage.dataset.theme = config.theme;
      if (params.get("preview") === "1") document.body.style.background = config.theme === "church"
        ? "#f8f8fb" : "linear-gradient(135deg, #32373d, #15171b 60%, #414449)";
      if (old.theme && old.theme !== config.theme) {
        clearTimeout(themeSwitchTimer);
        lowerThird.style.animation = "";
        liveCorner.style.animation = "";
        lowerThird.classList.remove("theme-switch");
        liveCorner.classList.remove("theme-switch");
        void lowerThird.offsetWidth;
        lowerThird.classList.add("theme-switch");
        liveCorner.classList.add("theme-switch");
        themeSwitchTimer = setTimeout(() => {
          lowerThird.classList.remove("theme-switch");
          liveCorner.classList.remove("theme-switch");
          lowerThird.style.animation = "none";
          liveCorner.style.animation = "none";
        }, 950);
      }
      config.supportingLines = Array.isArray(next.supportingLines) ? next.supportingLines
        : (next.subtitle ? [next.subtitle] : []);
      config.tickerItems = Array.isArray(next.tickerItems) ? next.tickerItems
        : String(next.ticker || "").split(",").map(item => item.trim()).filter(Boolean);
      for (const [field, cssVar] of Object.entries(cssFields)) root.style.setProperty(cssVar, config[field]);
      root.style.setProperty("--bottom-offset", `${config.bottomOffset}px`);
      root.style.setProperty("--side-inset", `${config.sideInset}px`);
      root.style.setProperty("--corner-top", `${config.cornerTop}px`);
      root.style.setProperty("--corner-left", `${config.cornerLeft}px`);
      byId("label").textContent = config.label === "BREAKING NEWS" && config.theme !== "news"
        ? (config.theme === "church" ? "MINISTERING" : "PODCAST LIVE") : config.label;
      document.querySelector(".ticker-lead").textContent = config.theme === "church" ? "SERVICE"
        : config.theme === "podcast" ? "ON THE MIC" : "LATEST";
      const linesChanged = JSON.stringify(old.supportingLines) !== JSON.stringify(config.supportingLines);
      const storyChanged = old.headline !== config.headline || linesChanged;
      const playedLive = Number.isInteger(old.storyRevision) && Number.isInteger(config.storyRevision)
        && config.storyRevision > old.storyRevision;
      if (storyChanged || playedLive) {
        setStory(config.headline, config.supportingLines[0] || "",
          (storyChanged || playedLive) && params.get("draft") !== "1");
      }
      if (storyChanged || playedLive || old.supportingInterval !== config.supportingInterval
          || old.showSubtitle !== config.showSubtitle) resetSupportingRotation();
      byId("clock-zone").textContent = config.zoneLabel;
      byId("stage").classList.toggle("is-off-air", !config.showOverlay);
      liveCorner.classList.toggle("is-hidden", !config.showLive);
      byId("label").classList.toggle("is-hidden", !config.showLabel);
      subtitleFrame.classList.toggle("is-hidden", !config.showSubtitle || !config.supportingLines.length);
      ticker.classList.toggle("is-hidden", !config.showTicker);
      lowerThird.classList.toggle("no-ticker", !config.showTicker);
      logoBox.classList.toggle("is-hidden", !config.showLogo);
      churchBrand.classList.toggle("is-hidden", !config.showLogo);
      if (old.logo !== config.logo || old.theme !== config.theme) {
        logoBox.classList.remove("has-logo");
        churchBrand.classList.remove("has-logo");
        logo.removeAttribute("src");
        churchLogo.removeAttribute("src");
        if (config.logo) { logo.src = config.logo; churchLogo.src = config.logo; }
      }
      if (old.pastorImage !== config.pastorImage || old.theme !== config.theme) {
        pastorPortrait.classList.remove("has-image");
        pastorPortrait.removeAttribute("src");
        if (config.pastorImage) pastorPortrait.src = config.pastorImage;
      }
      if (JSON.stringify(old.tickerItems) !== JSON.stringify(config.tickerItems)) buildTicker();
      if (old.tickerSeconds !== config.tickerSeconds) {
        track.style.setProperty("--crawl-duration", `${config.tickerSeconds}s`);
      }
      if (old.timeZone !== config.timeZone || old.showSeconds !== config.showSeconds) setClockFormatter();
      updateClock();
      if (config.speakerEventId !== lastSpeakerEventId) {
        lastSpeakerEventId = config.speakerEventId || "";
        if (lastSpeakerEventId) playSpeaker(config, Number(config.speakerStartedAt) || Date.now());
        else hideSpeaker();
      }
      if (config.verseEventId !== lastVerseEventId || old.theme !== config.theme) {
        const textOnly = Boolean(lastVerseEventId) && config.theme === "church" && old.theme === config.theme;
        lastVerseEventId = config.verseEventId || "";
        if (config.theme === "church" && lastVerseEventId) playVerse(config, Number(config.verseStartedAt) || Date.now(), textOnly);
        else hideVerse();
      }
    }
    // Force first render of logo, ticker, speed and clock formatter.
    const initial = config;
    config = { ...initial, logo: null, tickerItems: null, tickerSeconds: null, timeZone: null, showSeconds: null };
    applyState(initial);
    updateClock();
    setInterval(updateClock, 250);
    function fitStage() {
      root.style.setProperty("--scale", Math.min(innerWidth / 1920, innerHeight / 1080));
    }
    fitStage();
    addEventListener("resize", fitStage);
    if (params.get("demo") === "lines") {
      applyState({ ...config, headline: "SUPPORTING LINE DEMO",
        supportingLines: ["FIRST SUPPORTING LINE", "SECOND SUPPORTING LINE", "THIRD SUPPORTING LINE"],
        supportingInterval: 5, tickerItems: ["FIRST TICKER ITEM", "SECOND TICKER ITEM", "THIRD TICKER ITEM"] });
    } else if (params.get("demo") === "1") {
      const demoHeadlines = ["HEADLINE ANIMATION DEMO", "NEXT STORY IS COMING IN"];
      let demoIndex = 0;
      setTimeout(() => {
        applyState({ ...config, headline: demoHeadlines[demoIndex++] });
        setInterval(() => {
          applyState({ ...config, headline: demoHeadlines[demoIndex++ % demoHeadlines.length] });
        }, 3500);
      }, 1000);
    } else if (params.get("draft") === "1") {
      addEventListener("message", event => {
        if (event.origin === location.origin && event.data?.type === "draft-state") {
          applyState(event.data.state);
        } else if (event.origin === location.origin && event.data?.type === "speaker-preview") {
          playSpeaker(event.data.speaker);
        } else if (event.origin === location.origin && event.data?.type === "verse-preview") {
          playVerse(event.data.verse);
        }
      });
    } else if (location.protocol === "http:" || location.protocol === "https:") {
      let lastRevision = -1;
      addEventListener("message", event => {
        if (event.origin === location.origin && event.data?.type === "live-state") {
          lastRevision = event.data.state.revision;
          applyState(event.data.state);
        }
      });
      async function poll() {
        try {
          const response = await fetch("/api/state", { cache: "no-store" });
          if (!response.ok) throw new Error("State unavailable");
          const state = await response.json();
          if (state.revision > lastRevision) {
            lastRevision = state.revision;
            applyState(state);
          }
        } catch (error) { console.warn("Overlay state:", error.message); }
        setTimeout(poll, 400);
      }
      poll();
    }
  </script>
</body>
</html>

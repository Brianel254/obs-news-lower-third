<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lower Third Utility Dock</title>
<style>
  :root{color-scheme:dark;--bg:#1c1f27;--panel:#282c37;--line:#3c4250;--ink:#f4f6fb;--muted:#aeb5c4;--blue:#4f87e7;--red:#d61e3d;--green:#5bd1ae;--gold:#e8bd48}*{box-sizing:border-box}body{margin:0;min-width:260px;background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI",Tahoma,sans-serif}.top{height:42px;display:flex;align-items:center;gap:9px;padding:0 11px;background:#252a35;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.08em;font-size:11px}.mark{width:22px;height:22px;display:grid;place-items:center;border:1px solid #6799ef;border-radius:5px;color:#8eb5ff}.live{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px;letter-spacing:.04em}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px #5bd1ae}.body{padding:11px}.now{margin:0 0 10px;padding:8px 9px;background:#20242e;border-left:3px solid var(--blue);color:var(--muted);font-size:11px}.now strong{display:block;color:#fff;font-size:12px;margin-top:2px}.row{display:flex;gap:7px}.field{display:block;margin:9px 0}.field span{display:block;margin:0 0 4px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}input,select{width:100%;height:31px;border:1px solid var(--line);background:#151820;color:#fff;padding:0 8px;border-radius:3px;outline:none}input:focus,select:focus{border-color:#6f9cf0}button{height:31px;border:1px solid var(--line);border-radius:3px;padding:0 9px;background:#353a47;color:#fff;font-size:11px;font-weight:800;cursor:pointer}button:hover{border-color:#89aff4}button.primary{background:var(--red);border-color:var(--red)}button.good{background:#147c61;border-color:#147c61}button.gold{background:#a97911;border-color:#a97911}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.templates,.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:9px 0}.template,.theme{height:auto;min-height:48px;padding:5px;background:#242832;text-align:left}.template[aria-pressed=true],.theme[aria-pressed=true]{border-color:#83aaff;box-shadow:inset 0 0 0 1px #83aaff}.theme{grid-column:auto;text-align:center}.theme small,.template small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.theme.church[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.suggestions{display:none;max-height:138px;overflow:auto;margin-top:3px;border:1px solid var(--line);background:#12151c}.suggestions.show{display:block}.suggestions button{display:block;width:100%;height:auto;padding:7px 8px;border:0;border-bottom:1px solid #2e333e;border-radius:0;text-align:left;background:transparent}.suggestions button small{display:block;color:var(--muted);font-weight:400;margin-top:2px}.status{min-height:20px;margin-top:9px;color:var(--muted);font-size:11px}.status.error{color:#ff8798}.status.ok{color:#7be2c1}.help{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.hidden{display:none!important}
</style>
</head>
<body>
<header class="top"><span class="mark">◈</span><span id="title">LOWER THIRD</span><span class="live"><i class="dot"></i><span id="connection">CONNECTING</span></span></header>
<main class="body"><div class="now"><span id="now-label">LIVE OUTPUT</span><strong id="now-value">Connecting…</strong></div><section id="app"></section><div id="status" class="status"></div><div class="help">Changes go directly to the current OBS lower third.</div></main>
<script>
(() => {
  const mode = new URLSearchParams(location.search).get('mode') || 'verse';
  const app=document.getElementById('app'), status=document.getElementById('status'), now=document.getElementById('now-value');
  const title=document.getElementById('title'), connection=document.getElementById('connection'); let state={}, books=[], selected=null, selectedTheme='news';
  const q=s=>document.querySelector(s); const message=(text,kind='')=>{status.className=`status ${kind}`;status.textContent=text};
  async function api(path,data){const r=await fetch(path,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}
  const aliases={jhn:'John',jn:'John',ps:'Psalms',psa:'Psalms',gen:'Genesis',exo:'Exodus',rom:'Romans',cor:'1 Corinthians',tim:'1 Timothy',rev:'Revelation',matt:'Matthew',mk:'Mark',lk:'Luke',acts:'Acts',heb:'Hebrews',jas:'James',pet:'1 Peter'};
  function bookFor(value){const raw=value.trim().toLowerCase().replace(/\.$/,'');return books.find(b=>b.name.toLowerCase()===raw||b.code.toLowerCase()===raw)||books.find(b=>b.name.toLowerCase().startsWith(raw))||books.find(b=>b.name===aliases[raw])}
  function parse(value){const m=value.trim().match(/^(.+?)\s+(\d{1,3}):(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?$/);if(!m)return null;const book=bookFor(m[1]);return book?{book,chapter:+m[2],verse:+m[3],end:+(m[4]||m[3])}:null}
  async function lookup(info){return api(`/api/bible/lookup?${new URLSearchParams({book:info.book.code,chapter:info.chapter,verse:info.verse,end:info.end})}`)}
  function setSelected(v){selected=v;q('#verse').value=v.reference;q('#selection').textContent=`${v.reference} · ${v.text}`;q('#prev').disabled=q('#next').disabled=false}
  async function move(dir){if(!selected)return;let i=books.findIndex(b=>b.code===selected.book),b=books[i],c=selected.chapter,v=dir>0?selected.end+1:selected.verse-1;if(v<1){if(c>1){c--;v=b.chapters[c-1]}else if(i){b=books[--i];c=b.chapters.length;v=b.chapters[c-1]}else return message('First verse in the Bible','error')}if(v>b.chapters[c-1]){if(c<b.chapters.length){c++;v=1}else if(i<books.length-1){b=books[++i];c=1;v=1}else return message('Last verse in the Bible','error')}try{const next=await lookup({book:b,chapter:c,verse:v,end:v});setSelected(next);if(state.verseEventId)await playVerse(true);else message(`${next.reference} selected`,'ok')}catch(e){message(e.message,'error')}}
  async function playVerse(silent=false){if(!selected)return message('Search and select a verse first','error');try{const next=await api('/api/verse/play',{book:selected.book,chapter:selected.chapter,verse:selected.verse,end:selected.end,stay:+q('#stay').value});state=next;renderNow();message(`${next.verseReference} is live${silent?' · text transition':''}`,'ok')}catch(e){message(e.message,'error')}}
  function verseUI(){title.textContent='VERSE / LIVE';app.innerHTML=`<label class="field"><span>Book, chapter and verse</span><input id="verse" placeholder="jhn 3:16"></label><div id="suggestions" class="suggestions"></div><div id="selection" class="now">Choose a verse to take it live.</div><div class="grid"><label class="field"><span>On screen</span><select id="stay"><option value="6">6 sec</option><option value="8">8 sec</option><option value="10" selected>10 sec</option><option value="12">12 sec</option><option value="15">15 sec</option><option value="20">20 sec</option></select></label><div class="field"><span>Live action</span><button class="primary" id="play">▶ PLAY VERSE</button></div></div><div class="row"><button id="prev" disabled title="Previous verse">← PREVIOUS</button><button id="next" disabled title="Next verse">NEXT →</button><button id="hide" title="Take verse off air">TAKE OFF</button></div>`;q('#verse').addEventListener('input',()=>{const input=q('#verse'),list=q('#suggestions'),term=input.value.trim().toLowerCase(),ref=parse(term);list.replaceChildren();if(ref){lookup(ref).then(v=>{const b=document.createElement('button');b.innerHTML=`<strong>${v.reference}</strong><small>${v.text}</small>`;b.onclick=()=>{setSelected(v);list.classList.remove('show')};list.append(b);list.classList.add('show')}).catch(()=>{});return}if(term.length>1){books.filter(b=>b.name.toLowerCase().includes(term)||b.code.toLowerCase().includes(term)).slice(0,5).forEach(book=>{const b=document.createElement('button');b.textContent=book.name;b.onclick=()=>{input.value=`${book.name} `;input.focus();list.classList.remove('show')};list.append(b)});list.classList.toggle('show',list.children.length>0)}});q('#play').onclick=()=>playVerse();q('#prev').onclick=()=>move(-1);q('#next').onclick=()=>move(1);q('#hide').onclick=async()=>{state=await api('/api/verse/hide',{});renderNow();message('Verse leaving screen','ok')};if(state.verseBook&&state.verseText)setSelected({book:state.verseBook,chapter:state.verseChapter,verse:state.verseNumber,end:state.verseEnd,reference:state.verseReference,text:state.verseText});q('#stay').value=state.verseStay||10}
  function speakerUI(){title.textContent='SPEAKER ID / LIVE';app.innerHTML=`<label class="field"><span>Name</span><input id="name" maxlength="100" placeholder="Speaker name"></label><label class="field"><span>Role or title</span><input id="role" maxlength="100" placeholder="Pastor · Guest · Reporter"></label><div class="grid"><label class="field"><span>Screen side</span><select id="side"><option value="left">Left</option><option value="right">Right</option></select></label><label class="field"><span>On screen</span><select id="time">${[4,5,6,7,8,9,10].map(x=>`<option value="${x}">${x} sec</option>`).join('')}</select></label></div><span class="field"><span>Motion template</span></span><div class="templates">${[1,2,3,4].map((x)=>`<button class="template" data-template="${x}" aria-pressed="${x===1}">0${x}<small>${['BAR','TAG','PLATE','STRAP'][x-1]}</small></button>`).join('')}</div><div class="row"><button class="primary" id="play">▶ PLAY LIVE</button><button id="hide">TAKE OFF</button></div>`;let template=state.speakerTemplate||1;q('#name').value=state.speakerName||'';q('#role').value=state.speakerTitle||'';q('#side').value=state.speakerSide||'left';q('#time').value=state.speakerStay||4;app.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{template=+b.dataset.template;app.querySelectorAll('[data-template]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))});q('#play').onclick=async()=>{const speakerName=q('#name').value.trim();if(!speakerName)return message('Enter a speaker name','error');try{state=await api('/api/speaker/play',{speakerName,speakerTitle:q('#role').value.trim(),speakerTemplate:template,speakerSide:q('#side').value,speakerStay:+q('#time').value});renderNow();message('Speaker ID is live','ok')}catch(e){message(e.message,'error')}};q('#hide').onclick=async()=>{state=await api('/api/speaker/hide',{});renderNow();message('Speaker ID leaving screen','ok')}}
  const palettes={news:{accent:'#c90013',accentDark:'#87000c',panelLight:'#ffffff',panelDark:'#b6b9bc',headlineColor:'#292a2d',subtitleColor:'#616367',tickerColor:'#ffffff',logoBg:'#38393d'},church:{accent:'#e9bf3e',accentDark:'#ac7a13',panelLight:'#32148e',panelDark:'#14034e',headlineColor:'#ffffff',subtitleColor:'#ffffff',tickerColor:'#ffffff',logoBg:'#240d78'},podcast:{accent:'#47e1d1',accentDark:'#3b4b9b',panelLight:'#17212f',panelDark:'#101526',headlineColor:'#f8f9ff',subtitleColor:'#a9f4e9',tickerColor:'#f8f9ff',logoBg:'#1c2347'}};
  function themeUI(){title.textContent='THEMES / LIVE';selectedTheme=state.theme||'news';app.innerHTML=`<div class="themes">${['news','church','podcast'].map(x=>`<button class="theme ${x}" data-theme="${x}" aria-pressed="${x===selectedTheme}">${x.toUpperCase()}<small>${x==='church'?'Gold / royal blue':x==='news'?'Breaking news':'Audio show'}</small></button>`).join('')}</div><div class="now">Choose a format, then apply it to the live overlay.</div><button class="gold" id="apply">APPLY THEME LIVE</button>`;app.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{selectedTheme=b.dataset.theme;app.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));message(`${selectedTheme} theme ready to apply`,'ok')});q('#apply').onclick=async()=>{try{state=await api('/api/core',{...palettes[selectedTheme],theme:selectedTheme});renderNow();message(`${selectedTheme} theme is live`,'ok')}catch(e){message(e.message,'error')}}}
  function renderNow(){const verseLive=state.theme==='church'&&state.showOverlay&&state.verseEventId&&Date.now()-state.verseStartedAt<(Number(state.verseStay)*1000+1550);const speakerLive=state.showOverlay&&state.speakerEventId&&Date.now()-state.speakerStartedAt<(Number(state.speakerStay)*1000+1600);now.textContent=mode==='verse'?(verseLive?`${state.verseReference} · ON AIR`:state.theme!=='church'?'Select Church in the Themes dock':'No verse on air'):mode==='speaker'?(speakerLive?`${state.speakerName} · ON AIR`:'No speaker ID on air'):`${(state.theme||'news').toUpperCase()} THEME · LIVE`;}
  async function start(){try{[state,books]=await Promise.all([api('/api/state'),api('/api/bible/books').then(x=>x.books)]);connection.textContent='CONNECTED';renderNow();if(mode==='speaker')speakerUI();else if(mode==='themes')themeUI();else verseUI();setInterval(async()=>{try{state=await api('/api/state');renderNow()}catch(_){}},2500)}catch(e){connection.textContent='OFFLINE';message('Cannot reach the lower-third server','error')}}start();
})();
</script>
</body></html>
